<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitai - Probador virtual</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#FEFEFE;color:#0A0A23;font-family:'Inter',system-ui,sans-serif}
.serif{font-family:'Instrument Serif',serif}
header{border-bottom:1px solid #ECEEF2;background:rgba(255,255,255,0.8);backdrop-filter:blur(12px);position:sticky;top:0;z-index:20}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
.h{height:84px;display:flex;align-items:center;justify-content:center}
.btn{display:inline-flex;height:52px;padding:0 32px;border-radius:999px;background:#0AF5D4;color:#05003A;font-weight:600;text-decoration:none;align-items:center;justify-content:center;margin-top:24px}
.card{background:#F8F9FB;border:1px solid #ECEEF2;border-radius:28px;padding:28px;margin-top:40px}
</style>
</head>
<body>
<header><div class="wrap"><div class="h"><span class="serif" style="font-size:26px;color:#05003A;font-weight:400"><span style="color:#0AF5D4">●</span> vitai</span></div></div></header>
<main class="wrap" style="padding:60px 0">
<h1 style="font-size:56px;line-height:0.9;color:#05003A">Probate antes<br>de comprar.<br><span class="serif" style="font-style:italic">Acertá siempre.</span></h1>
<p style="margin-top:20px;max-width:360px;color:rgba(10,10,35,0.7);line-height:1.6">Menos dudas, menos cambios, hasta 40% menos devoluciones.</p>
<a class="btn" href="/api/stores">Probar demo</a>
<div class="card">
<p style="font-size:11px;text-transform:uppercase;letter-spacing:0.12em;color:rgba(5,0,58,0.3)">Live preview</p>
<div style="margin-top:20px;background:white;border:1px solid #ECEEF2;border-radius:999px;display:inline-flex;padding:8px 14px;gap:8px;align-items:center;font-size:13px"><span style="width:20px;height:20px;background:#05003A;color:white;border-radius:50%;display:flex;align-items:center;justify-content:center">✓</span>Talle recomendado: M — 98% match</div>
</div>
</main>
<footer class="wrap" style="border-top:1px solid #ECEEF2;padding:24px 0;margin-top:40px;display:flex;justify-content:space-between;font-size:12px;color:rgba(0,0,0,0.4)"><span>Vitai © 2026</span><span>Hecho en Argentina</span></footer>
</body>
</html>
